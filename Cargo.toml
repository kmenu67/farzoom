[package]
name = "farzoom"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Far Zoom: hold a key to zoom; start zoom and max zoom are adjustable."

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { git = "https://github.com/Vasysik/horizon-android", branch = "android" }

[profile.release]
opt-level = "s"
lto = true
